<!DOCTYPE html>
<html lang="uk"><head><meta charset="UTF-8"><title>Лист персонажа (фон)</title></head>
<body>
<script type="module">
  // Працює завжди, поки аддон увімкнено в кімнаті: показує сповіщення про кидки інших гравців.
  import { CH_ROLL, rollToastText, whenReady, getObr, onCmd, patchSummary, myId, getRoomChar, syncStatusBadge, syncHpBar, onTurn, isGM, getCombat, watchNewTokens, notify, renameItem, freeTokens, itemExists, registerFightMenu, guardGmOnly, setFightFlag, getTableRows, setCombat } from './js/owlbear.js';
  import { advance, npcSkipped, buildOrder, reconcile } from './js/combat.js';
  import { listCharacters, saveCharacter, newId } from './js/storage.js';
  await whenReady(60000);
  const OBR = getObr();
  if (OBR) OBR.onReady(() => {
    OBR.broadcast.onMessage(CH_ROLL, async (ev) => {
      const m = ev.data;
      if (!m) return;
      try {
        if (m.vis === 'dm' && (await OBR.player.getRole()) !== 'GM') return;
        const variant = m.crit === 'success' || m.success === true ? 'SUCCESS' : m.crit === 'fail' || m.success === false ? 'ERROR' : 'INFO';
        await OBR.notification.show(rollToastText(m), variant);
      } catch (e) { console.warn(e); }
    });
  });

  // Команди ГМа: стани персонажа й очищення ініціативи. Пишемо прямо в сховище листів
  // (воно спільне з вікном аддона) і повідомляємо відкрите вікно через BroadcastChannel.
  const bc = 'BroadcastChannel' in self ? new BroadcastChannel('owlbear-sheet') : null;
  onCmd(async (m) => {
    try {
      const all = await listCharacters();
      if (m.type === 'conds' && m.to === myId()) {
        const rec = all.find((c) => c.id === m.charId && c.id === getRoomChar());
        if (!rec) return;
        rec.data.conditions = Array.isArray(m.conds) ? m.conds.slice(0, 30) : [];
        await saveCharacter(rec);
        patchSummary({ conds: rec.data.conditions });
        if (rec.tokenId) await syncStatusBadge(rec.tokenId, rec.data.conditions).catch((e) => console.warn(e));
        bc && bc.postMessage({ type: 'reload', id: rec.id });
      } else if (m.type === 'hp' && m.to === myId()) {
        const rec = all.find((c) => c.id === m.charId && c.id === getRoomChar());
        if (!rec) return;
        const d = rec.data, int = (v, cap) => Math.max(0, Math.min(cap, Math.floor(Number(v) || 0)));
        const max = int(m.max, 99999) || int(d.hp_max, 99999), n = int(m.n, 9999);
        const cur = d.hp === undefined || d.hp === null ? max : int(d.hp, 99999);
        const hasTemp = rec.templateId === 'dnd5e';
        let hp = cur, tmp = hasTemp ? int(d.hp_temp, 9999) : 0;
        if (m.op === 'dmg') { const ab = Math.min(tmp, n); tmp -= ab; hp = Math.max(0, cur - (n - ab)); }
        else if (m.op === 'heal') hp = max > 0 ? Math.min(max, cur + n) : cur + n;
        else if (m.op === 'temp' && hasTemp) tmp = Math.max(tmp, n);
        else return;
        d.hp = hp; if (hasTemp) d.hp_temp = tmp;
        await saveCharacter(rec);
        patchSummary({ hp, tmp });
        if (rec.tokenId) await syncHpBar(rec.tokenId, hp, max, rec.barColor || null, tmp).catch((e) => console.warn(e));
        bc && bc.postMessage({ type: 'reload', id: rec.id });
      } else if (m.type === 'clear-init') {
        for (const rec of all.filter((c) => c.id === getRoomChar())) if (rec.data.init_roll !== undefined && rec.data.init_roll !== null) { rec.data.init_roll = null; await saveCharacter(rec); }
        patchSummary({ init: null });
        bc && bc.postMessage({ type: 'reload' });
      }
    } catch (e) { console.warn(e); }
  });

  // «Кінець ходу»: гравець, чий хід, (або ГМ) просить перейти далі; стан у сцені веде лише клієнт ГМа.
  onTurn(async (m, sender) => {
    try {
      if (m.type !== 'end' || !(await isGM())) return;
      const st = await getCombat();
      if (!st || !st.on) return;
      const cur = st.order[st.turn];
      if (!sender.gm && !(cur && cur.k === 'p' && cur.id === sender.id)) return;
      const npcs = new Map((await listCharacters()).filter((c) => c.npc).map((c) => [c.id, c]));
      await advance((e) => e.k === 'n' && npcSkipped(npcs.get(e.id)), { turn: m.turn, round: m.round });
    } catch (e) { console.warn(e); }
  });

  // Автоприв’язка: токен із зображенням НПС-шаблону. Якщо шаблон ще не має токена на столі —
  // прив’язується сам шаблон; кожен наступний токен отримує копію листа (Назва 2, 3…).
  let chain = Promise.resolve();
  const sumMax = (c) => Number(c.sum && c.sum.max) || (c.templateId === 'kontynent' ? (Number(c.data.con) || 0) * (Number(c.data.hp_mult) || 2) : Number(c.data.hp_max) || 0);
  // Лист гравця (не НПС) з прив’язаним зображенням: прив’язується лише до першого токена, дублів не створює.
  async function bindPlayer(it, all) {
    const rc = getRoomChar();
    const cands = all.filter((c) => !c.npc && c.asset && c.asset.url === it.image.url);
    const rec = cands.find((c) => c.id === rc) || cands[0];
    if (!rec) return false;
    if (rec.tokenId && (await itemExists(rec.tokenId))) return true;
    rec.tokenId = it.id;
    await saveCharacter(rec);
    const s = rec.sum;
    if (s && Number(s.max) > 0) await syncHpBar(it.id, Number(s.hp) || 0, Number(s.max), rec.barColor || null, Number(s.tmp) || 0, false);
    await syncStatusBadge(it.id, (rec.data && rec.data.conditions) || [], undefined, false);
    if (bc) bc.postMessage({ type: 'reload', id: rec.id, list: true });
    await notify(`«${(rec.data && rec.data.name) || 'Персонаж'}» прив’язано до токена`, 'SUCCESS');
    return true;
  }
  async function bindItem(it) {
    const all = await listCharacters();
    if (await bindPlayer(it, all)) return;
    if (!(await isGM())) return;
    const tpl = all.find((c) => c.npc && c.asset && c.asset.url === it.image.url);
    if (!tpl) return;
    if (!tpl.tokenId || !(await itemExists(tpl.tokenId))) {
      tpl.tokenId = it.id;
      await saveCharacter(tpl);
      const d = tpl.data, mx = sumMax(tpl);
      const hp = d.hp === undefined || d.hp === null ? mx : Number(d.hp) || 0;
      await syncHpBar(it.id, hp, mx, tpl.barColor || null, tpl.templateId === 'dnd5e' ? Number(d.hp_temp) || 0 : 0, true);
      await syncStatusBadge(it.id, d.conditions || [], undefined, !!tpl.hideStatus);
      await setFightFlag(it.id, tpl.fight ? 'in' : 'out');
      if (bc) bc.postMessage({ type: 'reload', id: tpl.id, list: true });
      await notify(`«${d.name || 'НПС'}» прив’язано до токена`, 'SUCCESS');
      return;
    }
    const base = (tpl.data && tpl.data.name) || 'НПС';
    let n = 1;
    for (const c of all) {
      if (c.fromTemplate !== tpl.id) continue;
      const m = String((c.data && c.data.name) || '').match(/(\d+)\s*$/);
      n = Math.max(n, m ? Number(m[1]) : 0);
    }
    const copy = JSON.parse(JSON.stringify(tpl));
    copy.id = newId();
    copy.fromTemplate = tpl.id;
    copy.asset = null;
    copy.tokenId = it.id;
    copy.data.name = `${base} ${n + 1}`;
    delete copy.data.hp;
    copy.data.conditions = [];
    copy.data.init_roll = null;
    if (copy.sum) copy.sum.init = null;
    await saveCharacter(copy);
    const max = sumMax(copy);
    await syncHpBar(it.id, max, max, copy.barColor || null, 0, true);
    await syncStatusBadge(it.id, [], undefined, !!copy.hideStatus);
    await renameItem(it.id, copy.data.name);
    await setFightFlag(it.id, copy.fight ? 'in' : 'out');
    if (bc) bc.postMessage({ type: 'reload', id: copy.id, list: true });
    await notify(`Створено «${copy.data.name}» і прив’язано до токена`, 'SUCCESS');
  }
  const queue = (fn) => { chain = chain.then(async () => { try { await fn(); } catch (e) { console.warn(e); } }); };
  watchNewTokens((items) => queue(async () => { for (const it of items) await bindItem(it); }));
  // Зображення щойно прив’язали до НПС (вікно аддона) — підхоплюємо токени, що вже стоять на столі.
  if (bc) bc.addEventListener('message', (ev) => {
    const m = ev.data;
    if (!m || m.type !== 'asset') return;
    queue(async () => {
      const tpl = (await listCharacters()).find((c) => c.id === m.id);
      if (!tpl || !tpl.asset) return;
      for (const it of await freeTokens(tpl.asset.url)) await bindItem(it);
    });
  });

  // Меню правої кнопки на токенах НПС: додати в бій / прибрати з бою.
  const syncCombatOrder = async () => {
    const st = await getCombat();
    if (!st || !st.on) return;
    const next = reconcile(st, buildOrder(await getTableRows(), (await listCharacters()).filter((c) => c.npc)));
    if (next) await setCombat(next);
  };
  isGM().then((gm) => { if (gm) guardGmOnly(); });
  isGM().then((gm) => { if (!gm) return; registerFightMenu((ids, want) => queue(async () => {
    const all = await listCharacters();
    let n = 0;
    for (const rec of all) {
      if (!rec.npc || !rec.tokenId || !ids.includes(rec.tokenId) || !!rec.fight === want) continue;
      rec.fight = want;
      await saveCharacter(rec);
      await setFightFlag(rec.tokenId, want ? 'in' : 'out');
      n++;
    }
    if (!n) { if (!all.some((r) => r.npc && r.tokenId && ids.includes(r.tokenId))) await notify('Виділені токени не прив’язані до НПС', 'WARNING'); return; }
    await syncCombatOrder();
    if (bc) bc.postMessage({ type: 'reload', list: true });
    await notify(want ? `У бій додано: ${n}` : `З бою прибрано: ${n}`, 'SUCCESS');
  })); });

  // Позначки «у бою / не в бою» на токенах НПС (за ними меню показує потрібний пункт): синхронізуємо зі сховищем.
  const syncFlags = () => queue(async () => {
    for (const r of (await listCharacters()).filter((c) => c.npc && c.tokenId)) await setFightFlag(r.tokenId, r.fight ? 'in' : 'out');
  });
  syncFlags();
  if (OBR) { OBR.onReady(() => { try { OBR.scene.onReadyChange((ready) => { if (ready) syncFlags(); }); } catch { /* ігноруємо */ } }); }
  if (bc) bc.addEventListener('message', (ev) => { if (ev.data && (ev.data.type === 'reload' || ev.data.type === 'asset')) syncFlags(); });
</script>
</body></html>
