<!DOCTYPE html>
<html lang="uk"><head><meta charset="UTF-8"><title>Лист персонажа (фон)</title></head>
<body>
<script type="module">
  // Працює завжди, поки аддон увімкнено в кімнаті: показує сповіщення про кидки інших гравців.
  import { CH_ROLL, rollToastText, whenReady, getObr } from './js/owlbear.js';
  await whenReady(60000);
  const OBR = getObr();
  if (OBR) OBR.onReady(() => {
    OBR.broadcast.onMessage(CH_ROLL, async (ev) => {
      const m = ev.data;
      if (!m) return;
      try {
        if (m.vis === 'dm' && (await OBR.player.getRole()) !== 'GM') return;
        const variant = m.crit === 'success' || m.success === true ? 'SUCCESS' : m.crit === 'fail' || m.success === false ? 'ERROR' : 'INFO';
        await OBR.notification.show(rollToastText(m), variant);
      } catch (e) { console.warn(e); }
    });
  });
</script>
</body></html>
