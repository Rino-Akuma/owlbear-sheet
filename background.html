<!DOCTYPE html>
<html lang="uk"><head><meta charset="UTF-8"><title>Лист персонажа (фон)</title></head>
<body>
<script type="module">
  // Працює завжди, поки аддон увімкнено в кімнаті: показує сповіщення про кидки інших гравців.
  import { CH_ROLL, rollToastText, whenReady, getObr, onCmd, patchSummary, myId, getRoomChar, syncStatusBadge, syncHpBar, onTurn, isGM, getCombat } from './js/owlbear.js';
  import { advance, npcSkipped } from './js/combat.js';
  import { listCharacters, saveCharacter } from './js/storage.js';
  await whenReady(60000);
  const OBR = getObr();
  if (OBR) OBR.onReady(() => {
    OBR.broadcast.onMessage(CH_ROLL, async (ev) => {
      const m = ev.data;
      if (!m) return;
      try {
        if (m.vis === 'dm' && (await OBR.player.getRole()) !== 'GM') return;
        const variant = m.crit === 'success' || m.success === true ? 'SUCCESS' : m.crit === 'fail' || m.success === false ? 'ERROR' : 'INFO';
        await OBR.notification.show(rollToastText(m), variant);
      } catch (e) { console.warn(e); }
    });
  });

  // Команди ГМа: стани персонажа й очищення ініціативи. Пишемо прямо в сховище листів
  // (воно спільне з вікном аддона) і повідомляємо відкрите вікно через BroadcastChannel.
  const bc = 'BroadcastChannel' in self ? new BroadcastChannel('owlbear-sheet') : null;
  onCmd(async (m) => {
    try {
      const all = await listCharacters();
      if (m.type === 'conds' && m.to === myId()) {
        const rec = all.find((c) => c.id === m.charId && c.id === getRoomChar());
        if (!rec) return;
        rec.data.conditions = Array.isArray(m.conds) ? m.conds.slice(0, 30) : [];
        await saveCharacter(rec);
        patchSummary({ conds: rec.data.conditions });
        if (rec.tokenId) await syncStatusBadge(rec.tokenId, rec.data.conditions).catch((e) => console.warn(e));
        bc && bc.postMessage({ type: 'reload', id: rec.id });
      } else if (m.type === 'hp' && m.to === myId()) {
        const rec = all.find((c) => c.id === m.charId && c.id === getRoomChar());
        if (!rec) return;
        const d = rec.data, int = (v, cap) => Math.max(0, Math.min(cap, Math.floor(Number(v) || 0)));
        const max = int(m.max, 99999) || int(d.hp_max, 99999), n = int(m.n, 9999);
        const cur = d.hp === undefined || d.hp === null ? max : int(d.hp, 99999);
        const hasTemp = rec.templateId === 'dnd5e';
        let hp = cur, tmp = hasTemp ? int(d.hp_temp, 9999) : 0;
        if (m.op === 'dmg') { const ab = Math.min(tmp, n); tmp -= ab; hp = Math.max(0, cur - (n - ab)); }
        else if (m.op === 'heal') hp = max > 0 ? Math.min(max, cur + n) : cur + n;
        else if (m.op === 'temp' && hasTemp) tmp = Math.max(tmp, n);
        else return;
        d.hp = hp; if (hasTemp) d.hp_temp = tmp;
        await saveCharacter(rec);
        patchSummary({ hp, tmp });
        if (rec.tokenId) await syncHpBar(rec.tokenId, hp, max, rec.barColor || null, tmp).catch((e) => console.warn(e));
        bc && bc.postMessage({ type: 'reload', id: rec.id });
      } else if (m.type === 'clear-init') {
        for (const rec of all.filter((c) => c.id === getRoomChar())) if (rec.data.init_roll !== undefined && rec.data.init_roll !== null) { rec.data.init_roll = null; await saveCharacter(rec); }
        patchSummary({ init: null });
        bc && bc.postMessage({ type: 'reload' });
      }
    } catch (e) { console.warn(e); }
  });

  // «Кінець ходу»: гравець, чий хід, (або ГМ) просить перейти далі; стан у сцені веде лише клієнт ГМа.
  onTurn(async (m, sender) => {
    try {
      if (m.type !== 'end' || !(await isGM())) return;
      const st = await getCombat();
      if (!st || !st.on) return;
      const cur = st.order[st.turn];
      if (!sender.gm && !(cur && cur.k === 'p' && cur.id === sender.id)) return;
      const npcs = new Map((await listCharacters()).filter((c) => c.npc).map((c) => [c.id, c]));
      await advance((e) => e.k === 'n' && npcSkipped(npcs.get(e.id)), { turn: m.turn, round: m.round });
    } catch (e) { console.warn(e); }
  });
</script>
</body></html>
