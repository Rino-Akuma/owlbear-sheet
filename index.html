<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лист персонажа</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">

  <aside class="side">
    <h1 id="app-title"></h1>
    <div class="side-actions">
      <button id="btn-new" class="primary" type="button"></button>
      <button id="btn-menu" class="menu-btn" type="button" aria-label="Меню">⋯</button>
      <div class="row2">
        <button id="btn-dup" type="button"></button>
        <button id="btn-del" type="button" class="danger-text"></button>
      </div>
    </div>
    <h2 id="chars-title" class="lbl"></h2>
    <ul id="char-list" class="char-list"></ul>
    <div id="empty" class="empty" hidden>
      <p id="empty-text"></p>
    </div>
    <div class="side-foot">
      <button id="btn-export" type="button"></button>
      <button id="btn-export-all" type="button"></button>
      <button id="btn-import" type="button"></button>
      <input id="file" type="file" accept=".json,application/json" hidden>
      <label id="win-wrap" class="field win-wrap" hidden><span class="lbl">Розмір вікна</span><select id="win-size"><option value="narrow">Вузьке (карта видна)</option><option value="mid">Середнє</option><option value="wide">Широке</option><option value="custom" hidden>Своє</option></select></label>
    </div>
  </aside>

  <main class="main">
    <div id="sheet-bar" class="sheet-bar" hidden>
      <span id="sheet-system" class="chip"></span>
      <span id="save-status" class="save-status"></span>
      <span class="win-ctl" hidden><span class="muted small">Вікно</span><button type="button" class="mini win-shrink" title="Зменшити вікно">−</button><button type="button" class="mini win-grow" title="Збільшити вікно">+</button></span>
    </div>
    <div id="welcome" class="welcome" hidden>
      <p>Створіть персонажа, щоб почати.</p>
      <button id="btn-first" type="button" class="primary"></button>
    </div>
    <div id="sheet" class="sheet"></div>
  </main>

  <aside class="rolls" id="rolls">
    <button id="rolls-strip" class="rolls-strip" type="button"><span id="strip-last">Кидки</span><b id="strip-arrow">▲</b></button>
    <h2 id="rolls-title"></h2>
    <div id="seg-adv" class="seg d20-only" role="group" hidden>
      <button type="button" data-adv="-1">Недолік</button>
      <button type="button" data-adv="0" class="on">Звичайно</button>
      <button type="button" data-adv="1">Перевага</button>
    </div>
    <div class="tray">
      <div id="tray-dice" class="tray-dice"></div>
      <div id="tray-pool" class="tray-pool"></div>
      <div class="tray-row">
        <div class="stepper"><button type="button" id="tr-minus" aria-label="−">−</button><input id="tr-mod" type="number" value="0" title="Модифікатор"><button type="button" id="tr-plus" aria-label="+">+</button></div>
        <button id="tr-clear" type="button" class="ghost">Очистити</button>
        <button id="tr-go" type="button" class="primary" disabled>Кинути</button>
      </div>
    </div>
    <div class="opts">
      <label id="lbl-vis" class="field span2" hidden>Хто бачить кидок<select id="in-vis"><option value="everyone">Усі</option><option value="dm">Майстер</option><option value="self">Лише я</option></select></label>
      <label id="lbl-diff" class="field">Складність<input id="in-diff" type="number" min="0"></label>
      <label id="lbl-bonus" class="field">Бонус до перевірок<input id="in-bonus" type="number"></label>
    </div>
    <details class="more d100-only"><summary>Критичні кидки</summary>
      <div class="opts">
        <label id="lbl-crit-hi" class="field">Крит. успіх<input id="in-crit-hi" type="number" min="1" max="100"></label>
        <label id="lbl-crit-lo" class="field">Крит. провал<input id="in-crit-lo" type="number" min="0" max="99"></label>
      </div>
    </details>
    <p id="opts-hint" class="muted small"></p>
    <div id="roll-groups"></div>
    <div class="log-head-row">
      <span class="lbl">Журнал</span>
      <button id="btn-clear-log" type="button" class="link"></button>
    </div>
    <div id="log" class="log"></div>
  </aside>

</div>
<div id="modal-root"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
