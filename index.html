<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лист персонажа</title>
<link rel="stylesheet" href="css/app.css">
<script type="module">
  // Розігріваємо SDK Owlbear якнайраніше (поки вантажиться решта аддона).
  if (window.parent !== window) {
    import('https://esm.sh/@owlbear-rodeo/sdk@3.1.0').catch(() => {});
    import('https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm').catch(() => {});
  }
</script>
</head>
<body>
<div class="app" data-view="home">

  <div id="turnbar" class="turnbar" hidden></div>

  <div class="body">

  <aside class="side">
    <h1 id="app-title"></h1>
    <div class="side-actions">
      <button id="btn-gm" type="button" class="gm-open" hidden>Меню ГМа</button>
      <button id="btn-chars" type="button" class="primary"></button>
      <button id="btn-dice-home" type="button" class="dice-toggle">Кубики</button>
    </div>
    <div class="side-foot">
      <button id="btn-export-all" type="button"></button>
      <button id="btn-import" type="button"></button>
      <input id="file" type="file" accept=".json,application/json" hidden>
      <label id="win-wrap" class="field win-wrap" hidden><span class="lbl">Розмір вікна</span><select id="win-size"><option value="narrow">Вузьке (карта видна)</option><option value="mid">Середнє</option><option value="wide">Широке</option><option value="custom" hidden>Своє</option></select></label>
    </div>
  </aside>

  <aside class="histcol" id="histcol">
    <div id="log-block" class="log-block">
      <div class="log-head-row">
        <span class="lbl">Історія кидків</span>
        <button id="btn-clear-log" type="button" class="link"></button>
      </div>
      <div id="log" class="log"></div>
    </div>
  </aside>

  <main class="main">
    <div id="sheet-bar" class="sheet-bar" hidden>
      <button id="btn-back" type="button" class="mini back-btn">← Меню</button>
      <span id="sheet-system" class="chip"></span>
      <span id="save-status" class="save-status"></span>
      <button id="btn-token" type="button" class="mini token-btn" hidden></button>
      <button id="btn-condmode" type="button" class="mini" hidden></button>
      <button type="button" class="mini btn-size" title="Розмір вікна" hidden>⤢ Вікно</button>
      <button id="btn-dice" type="button" class="mini dice-toggle">Кубики</button>
      <span class="more-wrap">
        <button id="btn-more" type="button" class="mini" aria-label="Ще">⋯</button>
        <div id="more-menu" class="more-menu" hidden>
          <span id="bar-color-wrap" class="bar-color" hidden><span class="muted small">Колір смужки HP</span><input id="bar-color" type="color" value="#3fae5a" title="Колір смужки HP"><button id="bar-auto" type="button" class="mini" title="Колір за залишком HP: зелений → жовтий → червоний">Авто</button></span>
          <button id="btn-room" type="button" class="mini room-btn" hidden></button>
          <label id="npc-opts" class="mini npc-opts" hidden><input id="npc-hide" type="checkbox"> Стани лише для ГМа</label>
          <label id="npc-fight-wrap" class="mini npc-opts" hidden><input id="npc-fight" type="checkbox"> Бере участь у бою</label>
          <details id="cond-legend" class="cond-legend" hidden><summary>Значки станів на токені</summary><div id="cond-legend-body" class="muted small"></div></details>
          <button id="btn-export" type="button"></button>
          <button id="btn-dup" type="button"></button>
          <button id="btn-del" type="button" class="danger-text"></button>
        </div>
      </span>
      <div id="cond-err" class="cond-err" hidden></div>
    </div>
    <div id="welcome" class="welcome" hidden>
      <p>Створіть персонажа, щоб почати.</p>
      <button id="btn-first" type="button" class="primary"></button>
    </div>
    <div id="sheet" class="sheet"></div>
  </main>

  <section id="chars-view" class="gm-view">
    <div class="gm-tabs">
      <button id="btn-chars-back" type="button" class="mini back-btn">← Меню</button>
      <button type="button" class="gm-tab on" id="chars-tab"></button>
      <button id="btn-new" type="button"></button>
      <span class="grow"></span>
      <button type="button" class="mini btn-size" title="Розмір вікна" hidden>⤢ Вікно</button>
      <button id="btn-dice-chars" type="button" class="mini dice-toggle">Кубики</button>
    </div>
    <div id="char-list" class="gm-list"></div>
    <div id="empty" class="empty" hidden><p id="empty-text"></p></div>
  </section>

  <section id="gm-view" class="gm-view">
    <div class="gm-tabs">
      <button id="btn-gm-back" type="button" class="mini back-btn">← Меню</button>
      <button type="button" class="gm-tab on" data-tab="players">Гравці</button>
      <button type="button" class="gm-tab" data-tab="npcs">НПС</button>
      <button type="button" class="gm-tab" data-tab="combat">Бій</button>
      <span class="grow"></span>
      <button type="button" class="mini btn-size" title="Розмір вікна" hidden>⤢ Вікно</button>
      <button id="btn-dice-gm" type="button" class="mini dice-toggle">Кубики</button>
    </div>
    <div id="gm-players" class="gm-pane"></div>
    <div id="gm-npcs" class="gm-pane" hidden></div>
    <div id="gm-combat" class="gm-pane" hidden></div>
  </section>

  <aside class="rolls" id="rolls">
    <button id="rolls-strip" class="rolls-strip" type="button"><span id="strip-last">Кидки</span><b id="strip-arrow">▲</b></button>
    <div class="rolls-head"><h2 id="rolls-title"></h2><button id="btn-dice-close" type="button" class="mini dice-close" title="Закрити панель кубиків" aria-label="Закрити">✕</button></div>
    <div id="seg-adv" class="seg d20-only" role="group" hidden>
      <button type="button" data-adv="-1">Недолік</button>
      <button type="button" data-adv="0" class="on">Звичайно</button>
      <button type="button" data-adv="1">Перевага</button>
    </div>
    <div class="tray">
      <div id="tray-dice" class="tray-dice"></div>
      <div id="tray-pool" class="tray-pool"></div>
      <label class="tray-attach"><input type="checkbox" id="tr-attach" checked> Додавати набрані кубики до наступної перевірки</label>
      <div class="tray-row">
        <div class="stepper"><button type="button" id="tr-minus" aria-label="−">−</button><input id="tr-mod" type="number" value="0" title="Модифікатор"><button type="button" id="tr-plus" aria-label="+">+</button></div>
        <button id="tr-clear" type="button" class="ghost">Очистити</button>
        <button id="tr-go" type="button" class="primary" disabled>Кинути</button>
      </div>
    </div>
    <div class="opts">
      <label id="lbl-vis" class="field span2" hidden>Хто бачить кидок<select id="in-vis"><option value="everyone">Усі</option><option value="dm">Майстер</option><option value="self">Лише я</option></select></label>
      <label id="lbl-diff" class="field">Складність<input id="in-diff" type="number" min="0"></label>
      <label id="lbl-bonus" class="field">Бонус до перевірок<input id="in-bonus" type="number"></label>
    </div>
    <details class="more d100-only"><summary>Критичні кидки</summary>
      <div class="opts">
        <label id="lbl-crit-hi" class="field">Крит. успіх<input id="in-crit-hi" type="number" min="1" max="100"></label>
        <label id="lbl-crit-lo" class="field">Крит. провал<input id="in-crit-lo" type="number" min="0" max="99"></label>
      </div>
    </details>
    <p id="opts-hint" class="muted small"></p>
    <div id="roll-groups"></div>
  </aside>

  </div>
</div>
<div id="modal-root"></div>
<div id="size-menu" class="more-menu" hidden>
  <span class="muted small">Розмір вікна</span>
  <div class="size-presets"><button type="button" class="mini" data-size="narrow">Вузьке</button><button type="button" class="mini" data-size="mid">Середнє</button><button type="button" class="mini" data-size="wide">Широке</button></div>
  <span class="win-ctl" hidden><span class="muted small">Точно</span><button type="button" class="mini win-shrink" title="Зменшити вікно">−</button><button type="button" class="mini win-grow" title="Збільшити вікно">+</button></span>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
